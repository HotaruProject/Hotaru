services:
  hotaru:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotaru:latest
    container_name: hotaru
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "8787:8787"
    volumes:
      - ./sanctuary:/app/sanctuary
      - ./observatory:/app/observatory
    environment:
      - PYTHONUNBUFFERED=1
      - HOTARU_SESSION_DIR=/app
