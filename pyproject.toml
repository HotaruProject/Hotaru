[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "hotaru"
dynamic = ["version"]
description = "A security-first Telegram userbot built on GoyGram"
requires-python = ">=3.13"
dependencies = [
    "goygram==0.8.27",
    "psutil>=6.1.0",
]

[project.scripts]
hotaru = "hotaru.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hotaru", "relay", "singularity"]

[tool.hatch.build.targets.wheel.force-include]
"constellations" = "hotaru/constellations"
"lexicon" = "hotaru/lexicon"
"singularity/assets" = "singularity/assets"
