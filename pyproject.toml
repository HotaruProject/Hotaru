[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hotaru"
version = "0.1.5"
description = "Hotaru userbot kernel on GoyGram"
requires-python = ">=3.11"
dependencies = [
    "basedpyright>=1.40.1",
    "goygram>=0.8.2",
    "rich>=13.7",
]

[project.scripts]
hotaru = "hotaru.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hotaru", "relay"]

[tool.hatch.build.targets.wheel.force-include]
"constellations" = "hotaru/constellations"
"lexicon" = "hotaru/lexicon"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
]
