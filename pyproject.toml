[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "hotaru"
dynamic = ["version"]
description = "Hotaru userbot kernel on GoyGram"
requires-python = ">=3.8"
dependencies = [
    "goygram==0.8.13",
]

[project.scripts]
hotaru = "hotaru.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hotaru", "relay"]

[tool.hatch.build.targets.wheel.force-include]
"constellations" = "hotaru/constellations"
"lexicon" = "hotaru/lexicon"
