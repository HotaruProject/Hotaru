[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hotaru"
version = "0.1.5"
description = "Hotaru userbot kernel on GoyGram"
requires-python = ">=3.11"
dependencies = [
    "goygram @ git+https://github.com/GoyGram/GoyGram.git@3040468",
]

[project.scripts]
hotaru = "hotaru.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hotaru", "relay"]
