[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hotarub"
version = "0.1.1"
description = "HotaruUB userbot kernel on GoyGram"
requires-python = ">=3.11"
dependencies = [
    "goygram @ git+https://github.com/GoyGram/GoyGram.git@e38bfe152e3e70500f758b158f71c5a7f26c3b80",
]

[project.scripts]
hotarub = "hotarub.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hotarub"]
