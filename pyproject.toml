[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hotarub"
version = "0.1.0"
description = "HotaruUB userbot kernel on GoyGram"
requires-python = ">=3.11"
dependencies = [
    "goygram @ git+https://github.com/GoyGram/GoyGram.git@5c29f1a37a2f35c247db07574004315ecd8471d8",
]

[project.scripts]
hotarub = "hotarub.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hotarub"]
